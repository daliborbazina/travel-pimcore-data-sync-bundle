# mime types are assumed to be included globally in nginx.conf

upstream php-pimcore {
    server pim-php-fpm:9000;
}

map $args $static_page_root {
    default                                 /var/tmp/pages;
    "~*(^|&)pimcore_editmode=true(&|$)"     /var/nonexistent;
    "~*(^|&)pimcore_preview=true(&|$)"      /var/nonexistent;
    "~*(^|&)pimcore_version=[^&]+(&|$)"     /var/nonexistent;
}

map $uri $static_page_uri {
    default                                 $uri;
    "/"                                     /%home;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 127.0.0.1 _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 100m;

    access_log /var/log/access.log;
    error_log  /var/log/error.log warn;

    # Protected/internal Pimcore paths
    location ~ ^/internal/.* {
        return 403;
    }

    location ~ ^/var/.*/internal(.*) {
        return 403;
    }

    location ~ ^/cache-buster\-[\d]+/internal(.*) {
        return 403;
    }

    # Pimcore head-link cache busting
    rewrite ^/cache-buster-(?:\d+)/(.*) /$1 last;

    # Never execute PHP from uploaded assets
    location ~* /var/assets/.*\.php(/|$) {
        return 404;
    }

    # Deny hidden files except .well-known
    location ~* /\.(?!well-known/) {
        deny all;
        log_not_found off;
        access_log off;
    }

    # Deny backup/config/source leftovers
    location ~* (?:\.(?:bak|conf(ig)?|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
    }

    # Needed by some Pimcore admin modules
    location ~* ^/admin/external {
        rewrite .* /index.php$is_args$args last;
    }

    # Thumbnails
    location ~* .*/(image|video)-thumb__\d+__.* {
        try_files /var/tmp/thumbnails$uri /index.php;
        expires 2w;
        access_log off;
        add_header Cache-Control "public";
    }

    # Static assets allowlist
    location ~* ^(?!/admin|/asset/webdav)(.+?)\.((?:css|js)(?:\.map)?|jpe?g|gif|png|svgz?|eps|exe|gz|zip|mp\d|m4a|ogg|ogv|webp|webm|pdf|docx?|xlsx?|pptx?)$ {
        try_files /var/assets$uri $uri =404;
        expires 2w;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public";
    }

    location / {
        error_page 404 /meta/404;
        try_files $static_page_root$static_page_uri.html $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        send_timeout 1800;
        fastcgi_read_timeout 1800;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;

        include fastcgi.conf;

        # Bypass try_files reset of PATH_INFO
        set $path_info $fastcgi_path_info;
        fastcgi_param PATH_INFO $path_info;

        # Better with symlinks/opcache
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # Mitigate httpoxy
        fastcgi_param HTTP_PROXY "";

        fastcgi_pass php-pimcore;
        internal;
    }
}