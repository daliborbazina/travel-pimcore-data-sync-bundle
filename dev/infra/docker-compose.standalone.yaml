services:
  pim-db:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pimcore
      MYSQL_USER: pimcore
      MYSQL_PASSWORD: pimcore
    ports:
      - "33061:3306"
    volumes:
      - pimcore_db_data:/var/lib/mysql
    networks:
        - pimcore_standalone

  pim-php-fpm:
    build:
      context: ../..
      dockerfile: dev/infra/php-fpm/Dockerfile
      args:
        PIMCORE_IMAGE: pimcore/pimcore:php8.3-min-latest
    restart: unless-stopped
    environment:
        APP_ENV: dev
        APP_DEBUG: 1
        APP_SECRET: change-me
        PIMCORE_DEV_MODE: "true"
        DATABASE_URL: "mysql://pimcore:pimcore@pim-db:3306/pimcore?charset=utf8mb4"

        PIMCORE_INSTALL_ADMIN_USERNAME: admin
        PIMCORE_INSTALL_ADMIN_PASSWORD: admin
        PIMCORE_INSTALL_MYSQL_HOST_SOCKET: pim-db
        PIMCORE_INSTALL_MYSQL_PORT: 3306
        PIMCORE_INSTALL_MYSQL_USERNAME: pimcore
        PIMCORE_INSTALL_MYSQL_PASSWORD: pimcore
        PIMCORE_INSTALL_MYSQL_DATABASE: pimcore
        PIMCORE_INSTALL_INSTALL_BUNDLES: "false"
    depends_on:
      - pim-db
    extra_hosts:
        - "host.docker.internal:host-gateway"
    volumes:
      - ../../dev/app-overlay/config/pimcore/classes:/var/www/html/config/pimcore/classes:rw
      - pimcore_var:/var/www/html/var
      - pimcore_public_var:/var/www/html/public/var
    networks:
      - pimcore_standalone

  pim-nginx:
      build:
          context: ../..
          dockerfile: dev/infra/nginx/Dockerfile
          args:
              PHP_FPM_IMAGE: travel-pimcore-data-sync-bundle-pim-php-fpm
      restart: unless-stopped
      depends_on:
        - pim-php-fpm
      ports:
        - "8080:80"
      volumes:
        - ./nginx/default.standalone.conf:/etc/nginx/conf.d/default.conf:ro
        - pimcore_var:/var/www/html/var
        - pimcore_public_var:/var/www/html/public/var
      networks:
        - pimcore_standalone

networks:
    pimcore_standalone:
        driver: bridge

volumes:
  pimcore_db_data:
  pimcore_var:
  pimcore_public_var:
